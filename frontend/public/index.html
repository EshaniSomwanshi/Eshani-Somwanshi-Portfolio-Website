        <!-- Restore the saved theme before first paint so there is no flash of the wrong palette. -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("portfolio-theme") || "paper";
                    document.documentElement.dataset.theme = t;
                    var c = { paper: "#F2EEE7", carbon: "#0B0B0B", petrol: "#052A31" }[t];
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m && c) m.setAttribute("content", c);
                } catch (e) {}
            })();
        </script>
